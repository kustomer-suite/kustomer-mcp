name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The sandbox's database tests need Postgres with pgvector.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SANDBOX_TEST_DB_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes the conformance suite against the local fake API and the evaluation's own tests.
      - run: npm test
      - run: npm run build
      # The quality gate: the oracle agent on both suites. No model, no secrets, no cost.
      # It fails when a task can no longer be solved through the server, when the server
      # shows protected data, or when the controls that give those checks meaning stop working.
      - run: node dist/eval/cli.js --gate
